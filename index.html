<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tic Tac Toe - Smart AI</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #dfe9f3, #ffffff);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      text-align: center;
      padding: 20px;
      background: #fff;
      border-radius: 15px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      max-width: 400px;
      width: 90%;
    }

    h1 {
      margin-top: 0;
      color: #333;
    }

    .game-mode {
      margin: 10px 0 20px;
    }

    #board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .cell {
      width: 100%;
      padding-top: 100%; /* 1:1 aspect ratio */
      position: relative;
      background: #f9f9f9;
      border: 2px solid #555;
      font-size: 2.5rem;
      font-weight: bold;
      cursor: pointer;
      border-radius: 8px;
      transition: background 0.3s;
    }

    .cell:hover {
      background: #eaeaea;
    }

    .cell span {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    #status {
      margin-top: 20px;
      font-size: 1.1rem;
      color: #333;
    }

    button {
      padding: 10px 20px;
      margin-top: 15px;
      font-size: 1rem;
      cursor: pointer;
      border: none;
      background-color: #333;
      color: #fff;
      border-radius: 5px;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #555;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Tic Tac Toe</h1>
    <div class="game-mode">
      <label><input type="checkbox" id="vsComputer" checked> Play vs Smart Computer (Minimax)</label>
    </div>
    <div id="board"></div>
    <div id="status">Player X's turn</div>
    <button onclick="resetGame()">Restart Game</button>
  </div>

  <script>
    const board = document.getElementById('board');
    const statusText = document.getElementById('status');
    const vsComputer = document.getElementById('vsComputer');

    let currentPlayer = 'X';
    let gameActive = true;
    let cells = ['', '', '', '', '', '', '', '', ''];

    function createBoard() {
      board.innerHTML = '';
      cells.forEach((val, i) => {
        const cell = document.createElement('div');
        cell.classList.add('cell');
        cell.dataset.index = i;
        const span = document.createElement('span');
        span.textContent = val;
        cell.appendChild(span);
        cell.addEventListener('click', handleCellClick);
        board.appendChild(cell);
      });
    }

    function handleCellClick(e) {
      const index = e.currentTarget.dataset.index;
      if (!gameActive || cells[index]) return;

      makeMove(index, currentPlayer);
      if (checkGameEnd(currentPlayer)) return;

      currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
      statusText.textContent = `Player ${currentPlayer}'s turn`;

      if (vsComputer.checked && currentPlayer === 'O') {
        setTimeout(() => {
          const bestMove = minimax(cells, 'O').index;
          makeMove(bestMove, 'O');
          if (checkGameEnd('O')) return;
          currentPlayer = 'X';
          statusText.textContent = `Player ${currentPlayer}'s turn`;
        }, 300);
      }
    }

    function makeMove(index, player) {
      cells[index] = player;
      const cellDiv = board.children[index];
      cellDiv.querySelector('span').textContent = player;
    }

    function checkWinner(player) {
      const wins = [
        [0,1,2], [3,4,5], [6,7,8],
        [0,3,6], [1,4,7], [2,5,8],
        [0,4,8], [2,4,6]
      ];
      return wins.some(combo =>
        combo.every(i => cells[i] === player)
      );
    }

    function checkGameEnd(player) {
      if (checkWinner(player)) {
        statusText.textContent = `Player ${player} wins! 🎉`;
        gameActive = false;
        return true;
      }
      if (!cells.includes('')) {
        statusText.textContent = "It's a draw! 🤝";
        gameActive = false;
        return true;
      }
      return false;
    }

    function minimax(newBoard, player) {
      const availSpots = newBoard
        .map((val, idx) => val === '' ? idx : null)
        .filter(val => val !== null);

      if (checkWin(newBoard, 'X')) return { score: -10 };
      if (checkWin(newBoard, 'O')) return { score: 10 };
      if (availSpots.length === 0) return { score: 0 };

      const moves = [];

      for (let i = 0; i < availSpots.length; i++) {
        const move = {};
        move.index = availSpots[i];
        newBoard[availSpots[i]] = player;

        const result = minimax(newBoard, player === 'O' ? 'X' : 'O');
        move.score = result.score;

        newBoard[availSpots[i]] = '';
        moves.push(move);
      }

      let bestMove;
      if (player === 'O') {
        let bestScore = -Infinity;
        for (let i = 0; i < moves.length; i++) {
          if (moves[i].score > bestScore) {
            bestScore = moves[i].score;
            bestMove = i;
          }
        }
      } else {
        let bestScore = Infinity;
        for (let i = 0; i < moves.length; i++) {
          if (moves[i].score < bestScore) {
            bestScore = moves[i].score;
            bestMove = i;
          }
        }
      }

      return moves[bestMove];
    }

    function checkWin(boardState, player) {
      const winCombos = [
        [0,1,2], [3,4,5], [6,7,8],
        [0,3,6], [1,4,7], [2,5,8],
        [0,4,8], [2,4,6]
      ];
      return winCombos.some(combo =>
        combo.every(i => boardState[i] === player)
      );
    }

    function resetGame() {
      currentPlayer = 'X';
      gameActive = true;
      cells = ['', '', '', '', '', '', '', '', ''];
      createBoard();
      statusText.textContent = `Player ${currentPlayer}'s turn`;
    }

    createBoard();
  </script>

</body>
</html>
